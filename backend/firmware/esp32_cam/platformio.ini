[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
; The AI-Thinker board has no onboard USB serial chip -- flashing needs
; an external FTDI/USB-serial adapter wired to GND/5V/U0R/U0T, with
; GPIO0 pulled to GND during flashing (and disconnected afterwards).
